<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova Dashboard</title>
    <link rel="stylesheet" href="./assets/tailwind.css" />
  </head>
  <body>
    <div class="min-h-screen">
      <div
        class="mx-auto flex min-h-screen w-full max-w-[1800px] gap-5 px-4 py-4 sm:px-6 sm:py-6 lg:px-8"
        id="app-shell"
      >
        <aside
          aria-label="Dashboard sidebar"
          class="glass-panel scrollbar-subtle fixed inset-y-4 left-4 z-30 hidden w-[22rem] max-w-[calc(100vw-2rem)] overflow-y-auto p-4 lg:sticky lg:top-6 lg:flex lg:h-[calc(100vh-3rem)]"
          id="sidebar"
        ></aside>

        <main
          class="flex min-h-[calc(100vh-2rem)] flex-1 flex-col gap-5 overflow-hidden rounded-[2rem]"
          id="main-content"
        >
          <header class="glass-panel flex flex-col gap-4 p-4 sm:p-5">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div>
                <p class="text-sm font-medium text-slate-500 dark:text-slate-400">New tab dashboard</p>
                <h1 class="text-2xl font-semibold tracking-tight sm:text-3xl">Start with what matters.</h1>
              </div>

              <div class="flex items-center gap-2">
                <button
                  aria-controls="sidebar"
                  aria-expanded="false"
                  class="icon-button lg:hidden"
                  id="sidebar-toggle"
                  type="button"
                >
                  <span class="sr-only">Toggle sidebar</span>
                  <svg aria-hidden="true" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" />
                  </svg>
                </button>

                <button class="icon-button" id="add-bookmark-button" type="button">
                  <span class="sr-only">Add bookmark</span>
                  <svg aria-hidden="true" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path d="M12 5v14M5 12h14" stroke-linecap="round" />
                  </svg>
                </button>

                <button class="icon-button" id="settings-button" type="button">
                  <span class="sr-only">Open settings</span>
                  <svg aria-hidden="true" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path d="M4.5 12a7.5 7.5 0 0115 0M12 4.5v2.25M12 17.25v2.25M4.5 12H2.25M21.75 12H19.5M6.697 6.697L5.1 5.1M18.9 18.9l-1.597-1.597M17.303 6.697L18.9 5.1M5.1 18.9l1.597-1.597" stroke-linecap="round" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>
            </div>

            <section id="search-bar"></section>
          </header>

          <section class="flex flex-1 flex-col overflow-hidden" id="dashboard-stage">
            <div class="flex-1" id="bookmark-grid"></div>
          </section>
        </main>
      </div>
    </div>

    <div id="modal-root"></div>
    <script type="module" src="./js/app.js"></script>
  </body>
  </html>
